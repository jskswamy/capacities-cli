name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - run: npm run build

      - run: npm test

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      # Everything below runs inside the Nix devShell — same node/tool versions
      # as `nix develop` locally, not the separate node-20 install `test` uses.
      - run: nix develop -c npm ci

      # Runs the exact same hooks, from the exact same flake.lock-pinned
      # tools, as `pre-commit run` locally — no separate CI-only config.
      - run: nix develop -c pre-commit run --all-files --show-diff-on-failure
